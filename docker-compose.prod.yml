name: spirit-store-prod

services:
  db:
    # pgvector: el catalogo usa VEHICLES.descriptionEmbedding (vector(768)) para
    # busqueda semantica. postgres:16-alpine no trae la extension.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spirit_store}
      POSTGRES_USER: ${POSTGRES_USER:-spirit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spirit_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spirit} -d ${POSTGRES_DB:-spirit_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # JWT, Groq y Supabase salen del .env de la raiz; abajo solo se pisa lo que cambia dentro de Docker.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-spirit}:${POSTGRES_PASSWORD:-spirit_password}@db:5432/${POSTGRES_DB:-spirit_store}?schema=public
      CLIENT_URL: ${CLIENT_URL:-*}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8081}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  db_data: