services:
  db:
    image: postgres:16-alpine
    container_name: spirit_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spirit_store}
      POSTGRES_USER: ${POSTGRES_USER:-spirit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spirit_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spirit} -d ${POSTGRES_DB:-spirit_store}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: spirit_store_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  db_data: